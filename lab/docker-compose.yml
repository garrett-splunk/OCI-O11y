# OCI Connector Hub → O11y Cloud workshop lab
# Redpanda simulates OCI Streaming (Kafka-compatible); collector consumes → OTLP logs

services:
  kafka:
    image: redpandadata/redpanda:v24.2.4
    container_name: oci-lab-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: redpandadata/redpanda:v24.2.4
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create oci-logs --brokers kafka:9092 --partitions 1 --replicas 1 || true
        rpk topic list --brokers kafka:9092
        echo "Topic oci-logs ready"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: oci-lab-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    env_file:
      - path: .env
        required: false
      - path: .env.splunk
        required: false
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-oci-connector-lab}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-oci-logs}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-oci-o11y-lab}
    ports:
      - "13133:13133"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  oci-log-producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    profiles:
      - tools
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: oci-logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes: {}
